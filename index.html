<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 8</title>
    <link rel="stylesheet" href="styles/index.css" />
  </head>
  <body>
    <form>
      <div class="box">
        <h2>Task 1: Toolbar Layout (Row, Justify-Contents, Align-Items)</h2>
        <section class="container box1">
          <div class="search">
            <input
              type="search"
              id="mySearch"
              name="search"
              placeholder="search products..."
            />
          </div>
          <div>
            <button name="Add" id="Add">+Add New Item</button>
          </div>
        </section>
        <h2>Task 2: Responsive Filter Tags (Flex-wrap & Align-content)</h2>
        <section class="container">
          <div class="tags">
            <span>Electronics</span>
            <span>Apparel</span>
            <span>Home &amp; Kitchen</span>
            <span>Books</span>
            <span>Sports</span>
            <span>Pcs</span>
          </div>
        </section>
      </div>
    </form>
  </body>
